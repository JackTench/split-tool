[package]
name = "split-tool"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/JackTench/split-tool"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize"] }
